const { useState, useEffect, useRef, useId } = React;

const TOTAL_FRAMES = 251;

// --- RUIXEN GRADIENT FOOTER ---
const MAXWELL_STOPS = [
  { offset: 0, color: "#080808" },
  { offset: 0.1827, color: "#690006" },
  { offset: 0.2837, color: "#93000a" },
  { offset: 0.4135, color: "#c00014" },
  { offset: 0.5866, color: "#e31e24" },
  { offset: 0.6827, color: "#ff1f26" },
  { offset: 0.8029, color: "#ffb4ab" },
  { offset: 1, color: "#ffdad600" },
];

function bellHeights(n, peak, valley) {
  const out = [];
  const mid = (n - 1) / 2;
  const VBH = 599;
  for (let i = 0; i < n; i++) {
    const t = mid === 0 ? 0 : Math.abs(i - mid) / mid;
    const eased = 1 - Math.pow(t, 1.24);
    out.push(peak * VBH * (valley + (1 - valley) * eased));
  }
  return out;
}

function RuixenGradientFooter({ children, gradientHeight = "40vh", minReveal = 0.05, bars = 9, blur = 20, peak = 0.98, valley = 0.55, stops = MAXWELL_STOPS }) {
  const uid = useId().replace(/:/g, "");
  const bandRef = useRef(null);
  const [progress, setProgress] = useState(minReveal);

  useEffect(() => {
    const el = bandRef.current;
    if (!el) return;
    const doc = el.ownerDocument;
    const win = doc.defaultView || window;
    const measure = () => {
      const h = el.offsetHeight || 1;
      const left = doc.documentElement.scrollHeight - win.innerHeight - win.scrollY;
      const t = Math.max(0, Math.min(1, (h - left) / h));
      setProgress(minReveal + (1 - minReveal) * t);
    };
    measure();
    win.addEventListener("scroll", measure, { passive: true });
    win.addEventListener("resize", measure, { passive: true });
    return () => {
      win.removeEventListener("scroll", measure);
      win.removeEventListener("resize", measure);
    };
  }, [minReveal]);

  const VBW = 1271;
  const VBH = 599;
  const colW = VBW / bars;

  return (
    <footer className="relative z-20 border-t border-white/10 bg-[#080808]" style={{ paddingBottom: gradientHeight }}>
      {children}
      <div
        ref={bandRef}
        aria-hidden
        style={{
          position: "fixed",
          left: 0, right: 0, bottom: 0,
          height: gradientHeight,
          pointerEvents: "none",
          transformOrigin: "bottom",
          transform: `scaleY(${progress})`,
          willChange: "transform",
          zIndex: 10,
        }}
      >
        <svg style={{ height: "100%", width: "100%", display: "block" }} viewBox={`0 0 ${VBW} ${VBH}`} preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id={`grad-${uid}`} x1="0" y1="1" x2="0" y2="0">
              {stops.map((s, i) => (
                <stop key={i} offset={s.offset} stopColor={s.color} />
              ))}
            </linearGradient>
            <filter id={`blur-${uid}`} x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation={blur} />
            </filter>
          </defs>
          {bellHeights(bars, peak, valley).map((barH, i) => (
            <g key={i} filter={`url(#blur-${uid})`}>
              <rect x={i * colW} y={VBH - barH} width={colW * 1.23} height={barH} fill={`url(#grad-${uid})`} />
            </g>
          ))}
        </svg>
      </div>
    </footer>
  );
}

// --- INTERACTIVE PRODUCT CARD ---
function InteractiveProductCard({ className = "", imageUrl, logoUrl, title, description, price }) {
  const cardRef = useRef(null);
  const [style, setStyle] = useState({});

  const handleMouseMove = (e) => {
    if (!cardRef.current) return;
    const { left, top, width, height } = cardRef.current.getBoundingClientRect();
    const x = e.clientX - left;
    const y = e.clientY - top;

    const rotateX = ((y - height / 2) / (height / 2)) * -8;
    const rotateY = ((x - width / 2) / (width / 2)) * 8;

    setStyle({
      transform: `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.04, 1.04, 1.04)`,
      transition: "transform 0.1s ease-out",
    });
  };

  const handleMouseLeave = () => {
    setStyle({
      transform: "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)",
      transition: "transform 0.4s ease-in-out",
    });
  };

  return (
    <div
      ref={cardRef}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
      style={style}
      className={`relative w-full max-w-[320px] aspect-[9/13] rounded-3xl bg-[#141414] shadow-2xl overflow-hidden border border-white/10 group cursor-pointer flex flex-col justify-between p-5 ${className}`}

        </div>

}

// --- AUREON MOTORS / BLENDER SCREENSHOT MATCHED HERO SECTION ---
function HeroFrameAnimationSection() {
    const canvasRef = useRef(null);
    const containerRef = useRef(null);
    const imagesRef = useRef([]);
    const currentFrameIndexRef = useRef(0);
    const targetFrameIndexRef = useRef(0);

    const [scrollFraction, setScrollFraction] = useState(0);

    useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const loadedImages = [];
        for (let i = 0; i < TOTAL_FRAMES; i++) {
            const img = new Image();
            const paddedNum = String(i + 1).padStart(4, '0');
            img.src = `./frames/frame_${paddedNum}.jpg`;
            img.onload = () => {
                if (i === 0) renderFrame(0);
            };
            loadedImages.push(img);
        }
        imagesRef.current = loadedImages;

        function renderFrame(index) {
            const img = imagesRef.current[index];
            if (!img || !img.complete) return;

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const hRatio = canvas.width / img.width;
            const vRatio = canvas.height / img.height;
            const ratio = Math.max(hRatio, vRatio);
            const shiftX = (canvas.width - img.width * ratio) / 2;
            const shiftY = (canvas.height - img.height * ratio) / 2;

            ctx.drawImage(img, 0, 0, img.width, img.height, shiftX, shiftY, img.width * ratio, img.height * ratio);
        }

        let animId;
        function animate() {
            if (Math.abs(targetFrameIndexRef.current - currentFrameIndexRef.current) > 0.01) {
                currentFrameIndexRef.current += (targetFrameIndexRef.current - currentFrameIndexRef.current) * 0.45;
                renderFrame(Math.round(currentFrameIndexRef.current));
            }
            animId = requestAnimationFrame(animate);
        }
        animate();

        const handleScroll = () => {
            const container = containerRef.current;
            if (!container) return;
            const rect = container.getBoundingClientRect();
            const maxScroll = container.offsetHeight - window.innerHeight;
            if (maxScroll <= 0) return;

            const scrollY = -rect.top;
            const fraction = Math.max(0, Math.min(1, scrollY / maxScroll));
            targetFrameIndexRef.current = Math.min(TOTAL_FRAMES - 1, Math.max(0, fraction * (TOTAL_FRAMES - 1)));
            setScrollFraction(fraction);
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        window.addEventListener('resize', () => renderFrame(Math.round(currentFrameIndexRef.current)));

        return () => {
            window.removeEventListener('scroll', handleScroll);
            cancelAnimationFrame(animId);
        };
    }, []);

    return (
        <div id="hero" ref={containerRef} className="relative" style={{ height: '350vh' }}>
            <div id="hero-sticky">
                {/* 30 FPS Frame-by-Frame Canvas Background */}
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full object-cover z-0" />

                {/* Cinematic Vignette */}
                <div className="absolute inset-0 bg-gradient-to-t from-[#080808] via-transparent to-black/40 z-10 pointer-events-none"></div>

                {/* SCROLL-DRIVEN SCATTER TEXT — text APPEARS as you scroll */}
                <div className="relative z-20 h-full w-full flex flex-col items-center justify-center px-4">
                    <div className="text-center" style={{ perspective: '600px' }}>
                        {"YOUR APPLIANCES".split('').map((char, i, arr) => {
                            const center = Math.floor(arr.length / 2);
                            const dist = i - center;
                            const t = Math.min(1, scrollFraction * 3);
                            const x = dist * 55 * (1 - t);
                            const rotX = dist * 45 * (1 - t);
                            const opacity = 0.15 + 0.85 * t;
                            const isSpace = char === ' ';
                            return (
                                <span key={i} className="inline-block text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.4)]" style={{
                                    transform: `translateX(${x}px) rotateX(${rotX}deg)`,
                                    opacity,
                                    transition: 'transform 0.08s ease-out, opacity 0.08s ease-out',
                                    fontSize: 'clamp(2.5rem, 8vw, 8rem)',
                                    fontWeight: 900,
                                    fontFamily: 'Quartzo, sans-serif',
                                    letterSpacing: '-0.03em',
                                    width: isSpace ? '0.4em' : 'auto',
                                }}>{char}</span>
                            );
                        })}
                    </div>
                    <p className="text-white/50 text-sm md:text-base font-space mt-6 tracking-widest uppercase" style={{ opacity: Math.min(1, scrollFraction * 4) }}>
                        Scroll to discover the collection
                    </p>
                </div>
            </div>
        </div>
    );
}

function ConnoisseurStackInteractor({ items = culinaryItems }) {
  const [activeIndex, setActiveIndex] = useState(0);
  const containerRef = useRef(null);
  const imageRef = useRef(null);
  const mainGroupRef = useRef(null);
  const masterTl = useRef(null);

  const createLoop = (index) => {
    const item = items[index];
    const selector = `#${item.clipId} .path`;
    if (masterTl.current) masterTl.current.kill();
    if (imageRef.current) imageRef.current.setAttribute("href", item.image);
    if (mainGroupRef.current) mainGroupRef.current.setAttribute("clip-path", `url(#${item.clipId})`);
    gsap.set(selector, { scale: 0, transformOrigin: "50% 50%" });
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.3 });
    tl.to(selector, { scale: 1, duration: 0.35, stagger: { amount: 0.15, from: "random" }, ease: "expo.out" })
      .to(selector, { scale: 1.05, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut", stagger: { amount: 0.1, from: "center" } })
      .to(selector, { scale: 0, duration: 0.25, stagger: { amount: 0.12, from: "edges" }, ease: "expo.in" });
    masterTl.current = tl;
  };

  useEffect(() => {
    createLoop(0);
    return () => { if (masterTl.current) masterTl.current.kill(); };
  }, []);

  const handleItemHover = (index) => {
    if (index === activeIndex) return;
    setActiveIndex(index);
    createLoop(index);
  };

  return (
    <div ref={containerRef} className="flex flex-col md:flex-row items-center justify-between w-full py-16 px-6 md:px-12 max-w-[1400px] mx-auto overflow-hidden">
      <div className="z-20 w-full md:w-1/2">
        <nav>
          <ul className="flex flex-col gap-10 md:gap-14">
            {items.map((item, index) => (
              <li key={item.num} onMouseEnter={() => handleItemHover(index)} className="group cursor-pointer">
                <div className="flex items-start gap-6">
                  <span className={`text-2xl md:text-4xl font-black font-space tracking-wider transition-all duration-500 mt-2 ${activeIndex === index ? "text-primary-container scale-110" : "text-zinc-600"}`}>{item.num}</span>
                  <h2 className={`text-3xl md:text-5xl font-black uppercase tracking-tight leading-[0.9] font-quartzo transition-all duration-700 ${activeIndex === index ? "text-white opacity-100 translate-x-3 drop-shadow-[0_0_15px_rgba(227,30,36,0.5)]" : "opacity-40 translate-x-0 text-transparent [-webkit-text-stroke:1.5px_#52525b]"}`}>
                    {item.name.split(' ')[0]}<br />{item.name.split(' ')[1]}
                  </h2>
                </div>
              </li>
            ))}
          </ul>
        </nav>
      </div>
      <div className="relative w-full md:w-1/2 flex justify-center items-center mt-12 md:mt-0">
        <div className="absolute w-[110%] h-[110%] bg-primary-container/10 blur-[100px] rounded-full transition-opacity duration-1000" />
        <svg viewBox="0 0 500 500" className="w-[100%] max-w-[460px] h-auto z-10 drop-shadow-[0_0_50px_rgba(227,30,36,0.35)]">

                @property --glow-radius { syntax: "<number>"; inherits: true; initial-value: 2; }
                @property --white-shadow { syntax: "<number>"; inherits: true; initial-value: 0; }

                .glow-container {
                  --card-color: #080808;
                  --text-color: #a1a1aa;
                  --card-radius: 1.5rem;
                  --border-width: 2px;
                  --bg-size: 1;
                  --hue: 0;
                  --hue-speed: 1;
                  --rotate: 0;
                  --animation-speed: 4s;
                  --interaction-speed: 0.55s;
                  --glow-scale: 1.5;
                  --scale-factor: 1;
                  --glow-blur: 6;
                  --glow-opacity: 1;
                  --glow-radius: 100;
                  --glow-rotate-unit: 1deg;

                  width: 100%;
                  height: 100%;
                  display: flex;
                  align-items: stretch;
                  position: relative;
                  z-index: 2;
                  border-radius: var(--card-radius);
                  cursor: pointer;
                }

                .glow-container:before,
                .glow-container:after {
                  content: "";
                  display: block;
                  position: absolute;
                  width: 100%;
                  height: 100%;
                  border-radius: var(--card-radius);
                }

                .glow-content {
                  position: relative; 
                  width: 100%;
                  background: var(--card-color);
                  border-radius: calc(var(--card-radius) * 0.9);
                  display: flex;
                  flex-direction: column;
                  padding: 1.5rem;
                  z-index: 5;
                }

                .glow-content:before {
                  content: "";
                  display: block;
                  position: absolute;
                  left: calc(var(--border-width) * -1);
                  top: calc(var(--border-width) * -1);
                  width: calc(100% + (var(--border-width) * 2));
                  height: calc(100% + (var(--border-width) * 2));
                  border-radius: var(--card-radius);
                  box-shadow: 0 0 20px black;
                  mix-blend-mode: color-burn;
                  z-index: -1;
                  background: hsl(0deg 0% 16%) radial-gradient(
                    40% 40% at calc(var(--bg-x) * 1%) calc(var(--bg-y) * 1%),
                    hsl(calc(var(--hue) * var(--hue-speed) * 1deg) 100% 90%) calc(0% * var(--bg-size)),
                    hsl(calc(var(--hue) * var(--hue-speed) * 1deg) 100% 80%) calc(20% * var(--bg-size)),
                    hsl(calc(var(--hue) * var(--hue-speed) * 1deg) 100% 60%) calc(40% * var(--bg-size)),
                    transparent 100%
                  );
                  animation: hue-animation var(--animation-speed) linear infinite,
                             rotate-bg var(--animation-speed) linear infinite;
                  transition: --bg-size var(--interaction-speed) ease;
                }

                .glow {
                  --glow-translate-y: 0;
                  display: block;
                  position: absolute;
                  width: 25%;
                  height: 25%;
                  left: 37.5%;
                  top: 37.5%;
                  animation: rotate var(--animation-speed) linear infinite;
                  transform: rotateZ(calc(var(--rotate) * var(--glow-rotate-unit)));
                  transform-origin: center;
                  border-radius: calc(var(--glow-radius) * 1vw);
                }

                .glow:after {
                  content: "";
                  display: block;
                  z-index: -2;
                  filter: blur(calc(var(--glow-blur) * 10px));
                  width: 130%;
                  height: 130%;
                  left: -15%;
                  top: -15%;
                  background: hsl(calc(var(--hue) * var(--hue-speed) * 1deg) 100% 60%);
                  position: relative;
                  border-radius: calc(var(--glow-radius) * 1vw);
                  animation: hue-animation var(--animation-speed) linear infinite;
                  transform: scaleY(calc(var(--glow-scale) * var(--scale-factor) / 1.1))
                             scaleX(calc(var(--glow-scale) * var(--scale-factor) * 1.2))
                             translateY(calc(var(--glow-translate-y) * 1%));
                  opacity: var(--glow-opacity);
                }

                .glow-container:hover .glow-content {
                  mix-blend-mode: darken;
                  --text-color: white;
                  box-shadow: 0 0 calc(var(--white-shadow) * 1vw) calc(var(--white-shadow) * 0.15vw) rgb(255 255 255 / 20%);
                  animation: shadow-pulse calc(var(--animation-speed) * 2) linear infinite;
                }

                .glow-container:hover .glow-content:before {
                  --bg-size: 15;
                  animation-play-state: paused;
                  transition: --bg-size var(--interaction-speed) ease;
                }

                .glow-container:hover .glow {
                  --glow-blur: 1.5;
                  --glow-opacity: 0.6;
                  --glow-scale: 2.5;
                  --glow-radius: 0;
                  --rotate: 900;
                  --glow-rotate-unit: 0;
                  --scale-factor: 1.25;
                  animation-play-state: paused;
                }

                .glow-container:hover .glow:after {
                  --glow-translate-y: 0;
                  animation-play-state: paused;
                  transition: --glow-translate-y 0s ease, --glow-blur 0.05s ease,
                              --glow-opacity 0.05s ease, --glow-scale 0.05s ease,
                              --glow-radius 0.05s ease;
                }

                @keyframes shadow-pulse {
                  0%, 24%, 46%, 73%, 96% { --white-shadow: 0.5; }
                  12%, 28%, 41%, 63%, 75%, 82%, 98% { --white-shadow: 2.5; }
                  6%, 32%, 57% { --white-shadow: 1.3; }
                  18%, 52%, 88% { --white-shadow: 3.5; }
                }
                @keyframes rotate-bg {
                  0% { --bg-x: 0; --bg-y: 0; }
                  25% { --bg-x: 100; --bg-y: 0; }
                  50% { --bg-x: 100; --bg-y: 100; }
                  75% { --bg-x: 0; --bg-y: 100; }
                  100% { --bg-x: 0; --bg-y: 0; }
                }
                @keyframes rotate {
                  from { --rotate: -70; --glow-translate-y: -65; }
                  25% { --glow-translate-y: -65; }
                  50% { --glow-translate-y: -65; }
                  60%, 75% { --glow-translate-y: -65; }
                  85% { --glow-translate-y: -65; }
                  to { --rotate: calc(360 - 70); --glow-translate-y: -65; }
                }
                @keyframes hue-animation {
                  0% { --hue: 0; }
                  100% { --hue: 360; }
                }
            `}</style>
            <div className="text-center mb-16 space-y-3">
                <span className="text-xs font-mono text-primary-container tracking-[0.3em] uppercase block">Engineering Excellence</span>
                <h2 className="text-3xl md:text-5xl font-black text-white uppercase font-quartzo tracking-tight">CORE TECHNOLOGY</h2>

function ScrollStrokeSection() {
    const sectionRef = useRef(null);
    const pathRef = useRef(null);
    const [pathProgress, setPathProgress] = useState(0);

    const productImages = [
        { src: "./product_iron.png", label: "Steam Iron", price: "₹14,999", pos: 0.15, top: '18%', left: '70%' },
        { src: "./product_vacuum.png", label: "Vacuum Cleaner", price: "₹29,999", pos: 0.35, top: '12%', left: '80%' },
        { src: "./product_robot_vacuum.png", label: "Robot Vacuum", price: "₹45,999", pos: 0.55, top: '35%', left: '82%' },
        { src: "./product_washing_machine.png", label: "Washing Machine", price: "₹59,999", pos: 0.75, top: '75%', left: '20%' },
    ];

    useEffect(() => {
        const section = sectionRef.current;
        if (!section) return;
        const handleScroll = () => {
            const rect = section.getBoundingClientRect();
            const sectionHeight = section.offsetHeight;
            const viewportH = window.innerHeight;
            const scrolled = -rect.top;
            const total = Math.max(1, sectionHeight - viewportH);
            if (scrolled <= 0) {
                setPathProgress(0);
                return;
            }
            const progress = Math.min(1, scrolled / total);
            setPathProgress(progress);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    useEffect(() => {
        const path = pathRef.current;
        if (!path) return;
        const totalLength = path.getTotalLength();
        
        path.style.strokeDasharray = totalLength;
        path.style.strokeDashoffset = totalLength * (1 - pathProgress);
    }, [pathProgress]);

    const getImageStyle = (posAlongPath) => {
        const revealed = pathProgress >= posAlongPath;
        const revealT = revealed ? Math.min(1, (pathProgress - posAlongPath) * 10) : 0;
        return {
            opacity: revealT,
            transform: `translate(-50%, -50%) scale(${0.5 + revealT * 0.5}) rotate(${(revealT - 1) * 15}deg)`,
            transition: 'opacity 0.2s ease-out, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
        };
    };

    return (
        <section
            ref={sectionRef}
            className="mx-auto flex flex-col items-center bg-[#080808] text-white relative"
            style={{ height: '400vh' }}
        >
            <div className="sticky top-0 h-screen w-full flex flex-col items-center justify-center overflow-hidden">

                    The Stroke <br /> That follows the <br />
                    Scroll Progress
                </h1>
                <p className="relative z-10 max-w-2xl text-lg md:text-xl font-space font-medium">
                    Scroll down to see the effect

                <svg
                    width="1278"
                    height="2319"
                    viewBox="0 0 1278 2319"
                    preserveAspectRatio="xMidYMid meet"
                    fill="none"
                    overflow="visible"
                    xmlns="http://www.w3.org/2000/svg"
                    className="w-full h-full opacity-80"
                >
                    <path
                        ref={pathRef}
                        d="M876.605 394.131C788.982 335.917 696.198 358.139 691.836 416.303C685.453 501.424 853.722 498.43 941.95 409.714C1016.1 335.156 1008.64 186.907 906.167 142.846C807.014 100.212 712.699 198.494 789.049 245.127C889.053 306.207 986.062 116.979 840.548 43.3233C743.932 -5.58141 678.027 57.1682 672.279 112.188C666.53 167.208 712.538 172.943 736.353 163.088C760.167 153.234 764.14 120.924 746.651 93.3868C717.461 47.4252 638.894 77.8642 601.018 116.979C568.164 150.908 557 201.079 576.467 246.924C593.342 286.664 630.24 310.55 671.68 302.614C756.114 286.446 729.747 206.546 681.86 186.442C630.54 164.898 492 209.318 495.026 287.644C496.837 334.494 518.402 366.466 582.455 367.287C680.013 368.538 771.538 299.456 898.634 292.434C1007.02 286.446 1192.67 309.384 1242.36 382.258C1266.99 418.39 1273.65 443.108 1247.75 474.477C1217.32 511.33 1149.4 511.259 1096.84 466.093C1044.29 420.928 1029.14 380.576 1033.97 324.172C1038.31 273.428 1069.55 228.986 1117.2 216.384C1152.2 207.128 1188.29 213.629 1194.45 245.127C1201.49 281.062 1132.22 280.104 1100.44 272.673C1065.32 264.464 1044.22 234.837 1032.77 201.413C1019.29 162.061 1029.71 131.126 1056.44 100.965C1086.19 67.4032 1143.96 54.5526 1175.78 86.1513C1207.02 117.17 1186.81 143.379 1156.22 166.691C1112.57 199.959 1052.57 186.238 999.784 155.164C957.312 130.164 899.171 63.7054 931.284 26.3214C952.068 2.12513 996.288 3.87363 1007.22 43.58C1018.15 83.2749 1003.56 122.644 975.969 163.376C948.377 204.107 907.272 255.122 913.558 321.045C919.727 385.734 990.968 497.068 1063.84 503.35C1111.46 507.456 1166.79 511.984 1175.68 464.527C1191.52 379.956 1101.26 334.985 1030.29 377.017C971.109 412.064 956.297 483.647 953.797 561.655C947.587 755.413 1197.56 941.828 936.039 1140.66C745.771 1285.32 321.926 950.737 134.536 1202.19C-6.68295 1391.68 -53.4837 1655.38 131.935 1760.5C478.381 1956.91 1124.19 1515 1201.28 1997.83C1273.66 2451.23 100.805 1864.7 303.794 2668.89"
                        stroke="#e31e24"

            </div>

            <div className="absolute bottom-10 w-[90%] max-w-[1400px] mx-auto rounded-[2rem] bg-[#e31e24] text-white pb-10 z-40 shadow-[0_0_50px_rgba(227,30,36,0.5)]">
                <h3 className="pt-10 text-center text-[12vw] md:text-[14vw] font-black leading-[0.85] tracking-tighter font-quartzo uppercase">
                    MAXWELL
                </h3>
                <div className="mt-20 md:mt-10 flex w-full flex-col items-start gap-5 px-6 md:px-12 font-space font-medium md:flex-row md:justify-between">

                        <p className="w-fit text-right text-sm md:text-left text-[#FAFDEE]/80">Est. 2026 <br /> Obsidian Series</p>
